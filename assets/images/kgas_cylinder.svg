<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Cylinder Body -->
  <rect x="30" y="70" width="140" height="190" rx="18" fill="url(#cylinderGradient)"/>
  
  <!-- Top Cap -->
  <ellipse cx="100" cy="70" rx="65" ry="22" fill="#2f855a"/>
  <ellipse cx="100" cy="65" rx="55" ry="18" fill="#48bb78"/>
  
  <!-- Valve Handle -->
  <rect x="90" y="35" width="20" height="30" rx="4" fill="#c53030"/>
  <circle cx="100" cy="40" r="10" fill="#e53e3e"/>
  
  <!-- Label Area -->
  <rect x="45" y="105" width="110" height="75" rx="8" fill="white" opacity="0.95"/>
  <text x="100" y="140" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#276749">K-GAS</text>
  <text x="100" y="158" text-anchor="middle" font-family="system-ui" font-size="11" fill="#38a169">6kg</text>
  <text x="100" y="172" text-anchor="middle" font-family="system-ui" font-size="9" fill="#718096">Clean Energy</text>
  
  <!-- Bottom Ring -->
  <rect x="40" y="235" width="120" height="12" rx="6" fill="#2f855a"/>
  
  <!-- Green Leaf Icon -->
  <path d="M100 200 Q85 185 100 170 Q115 185 100 200" fill="#48bb78"/>
  <path d="M100 195 Q90 187 100 180 Q110 187 100 195" fill="#68d391"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="cylinderGradient" x1="30" y1="70" x2="170" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#48bb78"/>
      <stop offset="0.5" stop-color="#2f855a"/>
      <stop offset="1" stop-color="#276749"/>
    </linearGradient>
  </defs>
</svg>
