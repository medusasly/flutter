<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Cylinder Body -->
  <rect x="30" y="60" width="140" height="200" rx="20" fill="url(#cylinderGradient)"/>
  
  <!-- Top Cap -->
  <ellipse cx="100" cy="60" rx="70" ry="25" fill="#1a365d"/>
  <ellipse cx="100" cy="55" rx="60" ry="20" fill="#2d5a8a"/>
  
  <!-- Valve Handle -->
  <rect x="85" y="20" width="30" height="35" rx="5" fill="#c53030"/>
  <circle cx="100" cy="25" r="12" fill="#e53e3e"/>
  
  <!-- Label Area -->
  <rect x="45" y="100" width="110" height="80" rx="8" fill="white" opacity="0.95"/>
  <text x="100" y="140" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#1a365d">TOTAL</text>
  <text x="100" y="160" text-anchor="middle" font-family="system-ui" font-size="12" fill="#4a5568">13kg</text>
  
  <!-- Bottom Ring -->
  <rect x="35" y="240" width="130" height="15" rx="7" fill="#1a365d"/>
  
  <!-- Flame Icon -->
  <path d="M100 190 Q90 170 100 150 Q110 170 100 190" fill="#ed8936"/>
  <path d="M100 185 Q95 175 100 165 Q105 175 100 185" fill="#f6ad55"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="cylinderGradient" x1="30" y1="60" x2="170" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d5a8a"/>
      <stop offset="0.5" stop-color="#1a365d"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>
</svg>
